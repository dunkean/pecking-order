[package]
name = "pecking-order"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Culture-themed organizational titles and roles for worldbuilding"
build = "build.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
unicode-normalization = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "pecking-order"
path = "src/main.rs"
